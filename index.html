<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blinkit Clone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>

        <div class="logo">
            blinkit
        </div>

        <div class="location">
            <h3>Delivery in 10 minutes</h3>
            <p>Meerut, Uttar Pradesh</p>
        </div>

        <div class="search">
            <input type="text" placeholder="Search for products">
        </div>

        <button class="login">Login</button>

        <button class="cart">My Cart</button>

    </header>


    <div class="banner">
        <div class="banner-image">

            <img src="Frame-1437256605-2-2.jpg"
                 alt="Fresh vegetables">

        </div>

    </div>

    <div class="cards">

        <div class="card">
            <img src="pharmacy-WEB.jpg"
                 alt="Pharmacy">
        </div>


        <div class="card">
            <img src="pet_crystal_WEB-1.png"
                 alt="Pet Care">
        </div>


        <div class="card">
            <img src="baby_crystal_WEB-1.png"
                 alt="Baby Care">
        </div>

    </div>


    
    <h2 class="heading">Categories</h2>

    <div class="categories">

        <div class="category">
            <img src="https://images.unsplash.com/photo-1542838132-92c53300491e"
                 alt="Vegetables">
            <p>Vegetables</p>
        </div>

        <div class="category">
            <img src="https://images.unsplash.com/photo-1619566636858-adf3ef46400b"
                 alt="Fruits">
            <p>Fruits</p>
        </div>

        <div class="category">
            <img src="https://images.unsplash.com/photo-1550583724-b2692b85b150"
                 alt="Milk">
            <p>Dairy</p>
        </div>

        <div class="category">
            <img src="https://images.unsplash.com/photo-1587049352846-4a222e784d38"
                 alt="Snacks">
            <p>Snacks</p>
        </div>

        <div class="category">
            <img src="https://images.unsplash.com/photo-1602143407151-7111542de6e8"
                 alt="Drinks">
            <p>Cold Drinks</p>
        </div>

        <div class="category">
            <img src="https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b"
                 alt="Personal Care">
            <p>Personal Care</p>
        </div>

    </div>

    <footer>
        <p class="copyright">
            © 2026 Blinkit Clone. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
